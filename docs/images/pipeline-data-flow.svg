<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1560" viewBox="0 0 800 1560" role="img" aria-labelledby="diagramTitle diagramDescription">
<title id="diagramTitle">NYC Taxi: Data Flow Diagram</title>
<desc id="diagramDescription">ภาพรวมข้อมูล NYC TLC: เที่ยวรถ Parquet และตารางพื้นที่ CSV เข้าสู่ขั้น 1–3 รับและตรวจข้อมูล ขั้น 4 เชื่อมพื้นที่เป็น curated Parquet ขั้น 5 ตรวจคุณภาพ 10 เงื่อนไข หากผ่านจึงไปขั้น 6 วิเคราะห์และขั้น 7 บันทึกผลสำเร็จ หากผิดพลาดจะบันทึก FAILED และเก็บผลสำเร็จเดิม จำนวนเที่ยวรวมจาก trip_count</desc>
<style>text { font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", sans-serif; font-variant-numeric: tabular-nums; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#526D84"/></marker></defs>
<rect width="800" height="1560" fill="#FFFFFF"/>
<text x="32" y="48" font-size="32" font-weight="600" fill="#253344" >NYC Taxi: Data Flow Diagram</text>
<text x="32" y="84" font-size="22" font-weight="400" fill="#526170" >ข้อมูล NYC TLC มกราคม–มิถุนายน 2024</text>
<path data-edge="trips:prepare" d="M204 256 V280 H400 V312" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="zones:prepare" d="M596 256 V280 H400 V312" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="prepare:join" d="M400 456 V504" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="join:curated" d="M400 640 V688" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="curated:quality" d="M400 848 V896" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="quality:analysis" d="M400 1032 V1080" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="analysis:publish" d="M400 1192 V1240" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="publish:outputs" d="M400 1352 V1400" fill="none" stroke="#526D84" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="trips" data-bounds="32,128,344,128">
<rect x="32" y="128" width="344" height="128" rx="0" fill="#F5F7F9" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="56" y="168" font-size="24" font-weight="600" fill="#253344" >ข้อมูลเที่ยวรถ</text>
<text x="56" y="208" font-size="20" font-weight="400" fill="#253344" >Trip Records (Parquet)</text>
<text x="56" y="236" font-size="20" font-weight="400" fill="#253344" >24 ไฟล์ จาก Taxi 4 ประเภท</text>
</g>
<g id="zones" data-bounds="424,128,344,128">
<rect x="424" y="128" width="344" height="128" rx="0" fill="#F5F7F9" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="448" y="168" font-size="24" font-weight="600" fill="#253344" >ข้อมูลพื้นที่</text>
<text x="448" y="208" font-size="20" font-weight="400" fill="#253344" >Taxi Zone Lookup (CSV)</text>
<text x="448" y="236" font-size="20" font-weight="400" fill="#253344" >265 รหัสพื้นที่</text>
</g>
<g id="prepare" data-bounds="96,312,608,144">
<rect x="96" y="312" width="608" height="144" rx="10" fill="#FFFFFF" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="120" y="352" font-size="26" font-weight="600" fill="#315C7E" >1–3. รับและเตรียมข้อมูล</text>
<text x="120" y="392" font-size="22" font-weight="400" fill="#253344" >อ่าน config ตรวจไฟล์และคอลัมน์ที่ต้องใช้</text>
<text x="120" y="420" font-size="22" font-weight="400" fill="#253344" >ตรวจพื้นที่และกฎเวลา แล้วสรุปเที่ยวรถรายวัน</text>
</g>
<g id="join" data-bounds="96,504,608,136">
<rect x="96" y="504" width="608" height="136" rx="10" fill="#FFFFFF" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="120" y="544" font-size="26" font-weight="600" fill="#315C7E" >4. เชื่อมข้อมูลพื้นที่</text>
<text x="120" y="584" font-size="22" font-weight="400" fill="#253344" >LEFT JOIN ด้วยรหัสพื้นที่รับผู้โดยสาร</text>
<text x="120" y="612" font-size="22" font-weight="400" fill="#253344" >เที่ยวที่ไม่ทราบพื้นที่ยังนับรวมเป็น Unknown</text>
</g>
<g id="curated" data-bounds="96,688,608,160">
<rect x="96" y="688" width="608" height="160" rx="0" fill="#EAF1F7" stroke="#315C7E" stroke-width="1.5"/>
<text x="120" y="728" font-size="26" font-weight="600" fill="#315C7E" >ชุดข้อมูลพร้อมวิเคราะห์ (Curated)</text>
<text x="120" y="768" font-size="22" font-weight="400" fill="#253344" >daily_zone_counts.parquet</text>
<text x="120" y="796" font-size="20" font-weight="400" fill="#253344" >สรุปรายวัน × ประเภท Taxi × พื้นที่ × ไฟล์ต้นทาง</text>
<text x="120" y="824" font-size="20" font-weight="400" fill="#253344" >จำนวนเที่ยวของแต่ละกลุ่มอยู่ใน trip_count</text>
</g>
<g id="quality" data-bounds="96,896,608,136">
<rect x="96" y="896" width="608" height="136" rx="10" fill="#FFFFFF" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="120" y="936" font-size="26" font-weight="600" fill="#315C7E" >5. ตรวจคุณภาพ 10 เงื่อนไข</text>
<text x="120" y="976" font-size="22" font-weight="400" fill="#253344" >เทียบยอด curated กับ audit</text>
<text x="120" y="1004" font-size="22" font-weight="400" fill="#526170" >ไม่ผ่าน: บันทึก FAILED และเก็บผลสำเร็จเดิม</text>
</g>
<g id="analysis" data-bounds="96,1080,608,112">
<rect x="96" y="1080" width="608" height="112" rx="10" fill="#FFFFFF" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="120" y="1120" font-size="26" font-weight="600" fill="#315C7E" >6. วิเคราะห์ผล</text>
<text x="120" y="1160" font-size="22" font-weight="400" fill="#253344" >รวม trip_count เพื่อจัดอันดับและสร้างกราฟ</text>
</g>
<g id="publish" data-bounds="96,1240,608,112">
<rect x="96" y="1240" width="608" height="112" rx="10" fill="#FFFFFF" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="120" y="1280" font-size="26" font-weight="600" fill="#315C7E" >7. บันทึกผลสำเร็จ</text>
<text x="120" y="1320" font-size="22" font-weight="400" fill="#253344" >บันทึก SUCCESS และอัปเดต latest.json</text>
</g>
<g id="outputs" data-bounds="96,1400,608,128">
<rect x="96" y="1400" width="608" height="128" rx="0" fill="#F5F7F9" stroke="#7D8D9B" stroke-width="1.5"/>
<text x="120" y="1440" font-size="26" font-weight="600" fill="#253344" >ผลลัพธ์ที่ตรวจสอบได้</text>
<text x="120" y="1480" font-size="20" font-weight="400" fill="#253344" >อันดับ / รายเดือน / พื้นที่ / กราฟ</text>
<text x="120" y="1508" font-size="20" font-weight="400" fill="#253344" >run.json / pipeline.log / content hash</text>
</g>
<text x="416" y="1064" font-size="18" font-weight="400" fill="#526170" data-edge-label="quality:analysis">ผ่านตรวจ</text>
</svg>
