<text x="56" y="90" font-size="18" fill="#586674" font-weight="400" text-anchor="start">มกราคม–มิถุนายน 2024  •  4 ประเภทรถ × 6 เดือน  •  หมายเลข 01–07 ตรงกับขั้นตอนใน log</text>
