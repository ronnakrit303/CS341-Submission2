<text x="764" y="537" font-size="19" fill="#374654" font-weight="400" text-anchor="start">ตรวจ SHA-256, schema และกฎเวลา</text>
<text x="764" y="564" font-size="19" fill="#374654" font-weight="400" text-anchor="start">สรุปรายวัน หรือใช้ cache ที่ตรงกัน</text>
</g>
