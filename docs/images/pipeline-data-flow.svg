<svg xmlns="http://www.w3.org/2000/svg" width="880" height="2616" viewBox="0 0 880 2616" role="img" aria-labelledby="diagramTitle diagramDescription">
<title id="diagramTitle">NYC Taxi: Data Flow Diagram</title>
<desc id="diagramDescription">ขั้น 1–4 รับการตั้งค่า JSON ข้อมูลเที่ยวรถ Parquet และตารางพื้นที่ CSV ตรวจและสรุปก่อน LEFT JOIN โดยเก็บพื้นที่ Unknown ได้ D3 curated และ D2 audit เพื่อส่งต่อไปตรวจคุณภาพ ขั้น 5–7 รับ D3 curated และ D2 audit จากช่วงเตรียมข้อมูล ตรวจคุณภาพ 10 เงื่อนไข สร้างผลวิเคราะห์ และบันทึก SUCCESS หากขั้นใดผิดพลาดจะบันทึก FAILED และรักษาผลสำเร็จเดิม หมายเลขตรงกับขั้นตอนใน log รหัส D2 และ D3 ที่อ้างถึงในสองภาพคือข้อมูลเดียวกัน</desc>
<style>text { font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", sans-serif; font-variant-numeric: tabular-nums; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#657787"/></marker></defs>
<rect width="880" height="2616" fill="#FFFFFF"/>
