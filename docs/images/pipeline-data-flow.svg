<text x="500" y="428" font-size="19" fill="#374654" font-weight="400" text-anchor="start">เตรียมรายการไฟล์สำหรับ</text>
<text x="500" y="455" font-size="19" fill="#374654" font-weight="400" text-anchor="start">การประมวลผล</text>
