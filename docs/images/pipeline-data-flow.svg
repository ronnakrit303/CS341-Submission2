<text x="764" y="617" font-size="19" fill="#374654" font-weight="400" text-anchor="start">ตรวจสอบ SHA-256 โครงสร้างข้อมูล และเงื่อนไขด้านเวลา</text>
<text x="764" y="644" font-size="19" fill="#374654" font-weight="400" text-anchor="start">สรุปจำนวนเที่ยวรายวัน หรือใช้ผลเดิมจาก cache</text>
<text x="764" y="671" font-size="19" fill="#374654" font-weight="400" text-anchor="start">หากข้อมูลตรงกัน</text>
</g>
