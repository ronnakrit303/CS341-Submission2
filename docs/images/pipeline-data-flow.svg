<text x="924" y="201" font-size="19" fill="#374654" font-weight="400" text-anchor="start">ข้อมูลการเดินทางรูปแบบ Parquet</text>
<text x="924" y="228" font-size="19" fill="#374654" font-weight="400" text-anchor="start">จาก NYC TLC</text>
<text x="924" y="255" font-size="19" fill="#374654" font-weight="400" text-anchor="start">รวม 24 ไฟล์ จาก Taxi 4 ประเภท</text>
