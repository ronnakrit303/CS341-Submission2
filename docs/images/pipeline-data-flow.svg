<text x="76" y="585" font-size="21" fill="#263341" font-weight="600" text-anchor="start">02 · LOOKUP</text>
<text x="76" y="617" font-size="19" fill="#374654" font-weight="400" text-anchor="start">โหลดและตรวจสอบข้อมูลพื้นที่จากไฟล์ CSV</text>
<text x="76" y="644" font-size="19" fill="#374654" font-weight="400" text-anchor="start">ตรวจสอบรหัสพื้นที่ทั้ง 265 รหัสว่าไม่ซ้ำกัน</text>
<text x="76" y="671" font-size="19" fill="#374654" font-weight="400" text-anchor="start">เก็บข้อมูลไว้ในหน่วยความจำเพื่อใช้งานต่อ</text>
</g>
