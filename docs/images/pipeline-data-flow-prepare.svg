<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1536" viewBox="0 0 880 1536" role="img" aria-labelledby="diagramTitle diagramDescription">
<title id="diagramTitle">NYC Taxi: Data Flow Diagram</title>
<desc id="diagramDescription">ขั้น 1–4 รับการตั้งค่า JSON ข้อมูลเที่ยวรถ Parquet และตารางพื้นที่ CSV ตรวจและสรุปก่อน LEFT JOIN โดยเก็บพื้นที่ Unknown ได้ D3 curated และ D2 audit เพื่อส่งต่อไปตรวจคุณภาพ หมายเลขตรงกับขั้นตอนใน log รหัส D2 และ D3 ที่อ้างถึงในสองภาพคือข้อมูลเดียวกัน</desc>
<style>text { font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", sans-serif; font-variant-numeric: tabular-nums; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#657787"/></marker></defs>
<rect width="880" height="1536" fill="#FFFFFF"/>
<g data-view="prepare" transform="translate(0 0)">
<text x="32" y="44" font-size="32" font-weight="600" fill="#25313B" text-anchor="start" >NYC Taxi: รับและเตรียมข้อมูล</text>
<text x="32" y="80" font-size="22" font-weight="400" fill="#52616F" text-anchor="start" >ขั้น 1–4 สำหรับข้อมูลมกราคม–มิถุนายน 2024</text>
<path data-edge="configSource:prepare" d="M440 208 V256" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="prepare:lookup" d="M256 368 V420 H432 V680 H416" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="prepare:trips" d="M624 368 V420 H448 V680 H464" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="zoneSource:lookup" d="M224 544 V608" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="tripSource:trips" d="M656 544 V608" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="lookup:zonesStore" d="M224 752 V824" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="trips:aggregateStore" d="M560 752 V824" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="aggregateStore:trips" d="M784 824 V752" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="zonesStore:curate" d="M224 968 V1012 H304 V1056" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="aggregateStore:curate" d="M656 968 V1012 H576 V1056" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="curate:curatedStore" d="M440 1200 V1272" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="prepare-configSource" data-bounds="32,112,816,96">
<rect x="32" y="112" width="816" height="96" rx="0" fill="#FFFFFF" stroke="#7D8B99" stroke-width="1.5"/>
<text x="52" y="148" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >การตั้งค่า pipeline (JSON)</text>
<text x="52" y="180" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >config/pipeline.json: ช่วงเดือน แหล่งข้อมูล และโฟลเดอร์</text>
</g>
<g id="prepare-prepare" data-bounds="208,256,464,112">
<rect x="208" y="256" width="464" height="112" rx="4" fill="#FFFFFF" stroke="#6E879B" stroke-width="1.5"/>
<path d="M209 304 H671" stroke="#D7DEE5" stroke-width="1"/>
<text x="228" y="292" font-size="24" font-weight="600" fill="#294A65" text-anchor="start" >1. เตรียมรายการข้อมูล</text>
<text x="228" y="328" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >อ่าน config และช่วงเดือน</text>
<text x="228" y="356" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >ระบุไฟล์สำหรับขั้น 2 และ 3</text>
</g>
<g id="prepare-zoneSource" data-bounds="32,432,384,112">
<rect x="32" y="432" width="384" height="112" rx="0" fill="#FFFFFF" stroke="#7D8B99" stroke-width="1.5"/>
<text x="52" y="468" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >Taxi Zone Lookup</text>
<text x="52" y="500" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >CSV จาก NYC TLC</text>
<text x="52" y="528" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >รหัสและชื่อพื้นที่</text>
</g>
<g id="prepare-tripSource" data-bounds="464,432,384,112">
<rect x="464" y="432" width="384" height="112" rx="0" fill="#FFFFFF" stroke="#7D8B99" stroke-width="1.5"/>
<text x="484" y="468" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >Trip Records</text>
<text x="484" y="500" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >Parquet จาก NYC TLC</text>
<text x="484" y="528" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >24 ไฟล์ จาก Taxi 4 ประเภท</text>
</g>
<g id="prepare-lookup" data-bounds="32,608,384,144">
<rect x="32" y="608" width="384" height="144" rx="4" fill="#FFFFFF" stroke="#6E879B" stroke-width="1.5"/>
<path d="M33 656 H415" stroke="#D7DEE5" stroke-width="1"/>
<text x="52" y="644" font-size="24" font-weight="600" fill="#294A65" text-anchor="start" >2. ตรวจตารางพื้นที่</text>
<text x="52" y="688" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >ตรวจคอลัมน์และรหัสพื้นที่</text>
<text x="52" y="720" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >LocationID ต้องไม่ซ้ำ</text>
</g>
<g id="prepare-trips" data-bounds="464,608,384,144">
<rect x="464" y="608" width="384" height="144" rx="4" fill="#FFFFFF" stroke="#6E879B" stroke-width="1.5"/>
<path d="M465 656 H847" stroke="#D7DEE5" stroke-width="1"/>
<text x="484" y="644" font-size="24" font-weight="600" fill="#294A65" text-anchor="start" >3. ตรวจและสรุปเที่ยวรถ</text>
<text x="484" y="688" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >ตรวจ SHA-256 และกฎเวลา</text>
<text x="484" y="720" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >สรุปรายวัน หรือใช้ cache</text>
</g>
<g id="prepare-zonesStore" data-bounds="32,824,384,144">
<rect x="32" y="824" width="384" height="144" fill="#FFFFFF"/>
<path d="M416 824 H32 V968 H416 M76 824 V968" fill="none" stroke="#7D8B99" stroke-width="1.5"/>
<text x="54" y="860" font-size="22" font-weight="600" fill="#25313B" text-anchor="middle" >D1</text>
<text x="96" y="860" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >พื้นที่ที่ผ่านตรวจ</text>
<text x="96" y="896" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >265 รหัสในหน่วยความจำ</text>
<text x="96" y="928" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >Zone และ Borough</text>
</g>
<g id="prepare-aggregateStore" data-bounds="464,824,384,144">
<rect x="464" y="824" width="384" height="144" fill="#FFFFFF"/>
<path d="M848 824 H464 V968 H848 M508 824 V968" fill="none" stroke="#7D8B99" stroke-width="1.5"/>
<text x="486" y="860" font-size="22" font-weight="600" fill="#25313B" text-anchor="middle" >D2</text>
<text x="528" y="860" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >ผลสรุปและ audit</text>
<text x="528" y="896" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >data/cache/</text>
<text x="528" y="928" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >raw / valid / rejected</text>
</g>
<g id="prepare-curate" data-bounds="208,1056,464,144">
<rect x="208" y="1056" width="464" height="144" rx="4" fill="#FFFFFF" stroke="#6E879B" stroke-width="1.5"/>
<path d="M209 1104 H671" stroke="#D7DEE5" stroke-width="1"/>
<text x="228" y="1092" font-size="24" font-weight="600" fill="#294A65" text-anchor="start" >4. เชื่อมข้อมูลพื้นที่</text>
<text x="228" y="1136" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >LEFT JOIN ด้วย pickup_location_id</text>
<text x="228" y="1168" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >เก็บพื้นที่ที่ไม่ทราบเป็น Unknown</text>
</g>
<g id="prepare-curatedStore" data-bounds="32,1272,816,160">
<rect x="32" y="1272" width="816" height="160" fill="#EEF3F8"/>
<path d="M848 1272 H32 V1432 H848 M76 1272 V1432" fill="none" stroke="#7D8B99" stroke-width="1.5"/>
<text x="54" y="1308" font-size="22" font-weight="600" fill="#25313B" text-anchor="middle" >D3</text>
<text x="96" y="1308" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >ชุดข้อมูลพร้อมวิเคราะห์ (Curated)</text>
<text x="96" y="1344" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >daily_zone_counts.parquet</text>
<text x="96" y="1376" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >วัน × ประเภท Taxi × พื้นที่รับผู้โดยสาร × ไฟล์ต้นทาง</text>
<text x="96" y="1408" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >จำนวนเที่ยวของแต่ละกลุ่มอยู่ใน trip_count</text>
</g>
<text x="280" y="408" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="prepare:lookup">URL พื้นที่</text>
<text x="600" y="408" font-size="20" font-weight="400" fill="#52616F" text-anchor="end" data-edge-label="prepare:trips">รายการไฟล์</text>
<text x="240" y="588" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="zoneSource:lookup">CSV</text>
<text x="672" y="588" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="tripSource:trips">Parquet</text>
<text x="240" y="796" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="lookup:zonesStore">ผ่านตรวจ</text>
<text x="576" y="796" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="trips:aggregateStore">บันทึก</text>
<text x="768" y="796" font-size="20" font-weight="400" fill="#52616F" text-anchor="end" data-edge-label="aggregateStore:trips">ใช้ซ้ำ</text>
<text x="80" y="1000" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="zonesStore:curate">ข้อมูลพื้นที่</text>
<text x="680" y="1000" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="aggregateStore:curate">ยอดรายวัน</text>
<text x="456" y="1244" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="curate:curatedStore">สรุปหลังเชื่อมพื้นที่</text>
<text x="32" y="1480" font-size="21" font-weight="400" fill="#52616F" text-anchor="start" data-note="true">ใช้ cache เมื่อ hash ของข้อมูล การตั้งค่า และ logic ตรงกัน</text>
<text x="32" y="1512" font-size="21" font-weight="400" fill="#52616F" text-anchor="start" data-note="true">D3 ส่งต่อไปตรวจคุณภาพในภาพถัดไป ส่วน audit มาจาก D2</text>
</g>
</svg>
