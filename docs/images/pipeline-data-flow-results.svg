<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1080" viewBox="0 0 880 1080" role="img" aria-labelledby="diagramTitle diagramDescription">
<title id="diagramTitle">NYC Taxi: Data Flow Diagram</title>
<desc id="diagramDescription">ขั้น 5–7 รับ D3 curated และ D2 audit จากช่วงเตรียมข้อมูล ตรวจคุณภาพ 10 เงื่อนไข สร้างผลวิเคราะห์ และบันทึก SUCCESS หากขั้นใดผิดพลาดจะบันทึก FAILED และรักษาผลสำเร็จเดิม หมายเลขตรงกับขั้นตอนใน log รหัส D2 และ D3 ที่อ้างถึงในสองภาพคือข้อมูลเดียวกัน</desc>
<style>text { font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", sans-serif; font-variant-numeric: tabular-nums; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#657787"/></marker></defs>
<rect width="880" height="1080" fill="#FFFFFF"/>
<g data-view="results" transform="translate(0 0)">
<text x="32" y="44" font-size="32" font-weight="600" fill="#25313B" text-anchor="start" >ตรวจคุณภาพและสร้างผลลัพธ์</text>
<text x="32" y="80" font-size="22" font-weight="400" fill="#52616F" text-anchor="start" >ขั้น 5–7 รับ curated และ audit จากภาพก่อนหน้า</text>
<path data-edge="curatedStore:quality" d="M272 248 V336" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="aggregateStore:quality" d="M720 248 V292 H448 V336" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="quality:analysis" d="M272 480 V576" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="quality:failed" d="M512 408 H592" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<path data-edge="analysis:resultStore" d="M512 648 H592" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="analysis:publish" d="M272 720 V832" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-edge="publish:successStore" d="M512 904 H592" fill="none" stroke="#657787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g id="results-curatedStore" data-bounds="32,112,480,136">
<rect x="32" y="112" width="480" height="136" fill="#EEF3F8"/>
<path d="M512 112 H32 V248 H512 M76 112 V248" fill="none" stroke="#7D8B99" stroke-width="1.5"/>
<text x="54" y="148" font-size="22" font-weight="600" fill="#25313B" text-anchor="middle" >D3</text>
<text x="96" y="148" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >Curated จากขั้น 4</text>
<text x="96" y="184" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >daily_zone_counts.parquet</text>
<text x="96" y="216" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >จำนวนเที่ยวอยู่ใน trip_count</text>
</g>
<g id="results-aggregateStore" data-bounds="592,112,256,136">
<rect x="592" y="112" width="256" height="136" fill="#FFFFFF"/>
<path d="M848 112 H592 V248 H848 M636 112 V248" fill="none" stroke="#7D8B99" stroke-width="1.5"/>
<text x="614" y="148" font-size="22" font-weight="600" fill="#25313B" text-anchor="middle" >D2</text>
<text x="656" y="148" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >Audit จากขั้น 3</text>
<text x="656" y="184" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >raw / valid</text>
<text x="656" y="216" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >rejected</text>
</g>
<g id="results-quality" data-bounds="32,336,480,144">
<rect x="32" y="336" width="480" height="144" rx="4" fill="#FFFFFF" stroke="#6E879B" stroke-width="1.5"/>
<path d="M33 384 H511" stroke="#D7DEE5" stroke-width="1"/>
<text x="52" y="372" font-size="24" font-weight="600" fill="#294A65" text-anchor="start" >5. ตรวจคุณภาพข้อมูล</text>
<text x="52" y="416" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >เทียบยอด curated กับ audit</text>
<text x="52" y="448" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >ต้องผ่านครบ 10 เงื่อนไข</text>
</g>
<g id="results-failed" data-bounds="592,336,256,144">
<rect x="592" y="336" width="256" height="144" rx="0" fill="#FFFFFF" stroke="#7D8B99" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="612" y="372" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >FAILED</text>
<text x="612" y="404" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >บันทึก log</text>
<text x="612" y="432" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >คงผลสำเร็จเดิม</text>
</g>
<g id="results-analysis" data-bounds="32,576,480,144">
<rect x="32" y="576" width="480" height="144" rx="4" fill="#FFFFFF" stroke="#6E879B" stroke-width="1.5"/>
<path d="M33 624 H511" stroke="#D7DEE5" stroke-width="1"/>
<text x="52" y="612" font-size="24" font-weight="600" fill="#294A65" text-anchor="start" >6. วิเคราะห์ผล</text>
<text x="52" y="656" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >รวม trip_count เพื่อจัดอันดับ</text>
<text x="52" y="688" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >สร้างตารางรายเดือนและพื้นที่</text>
</g>
<g id="results-resultStore" data-bounds="592,576,256,144">
<rect x="592" y="576" width="256" height="144" fill="#FFFFFF"/>
<path d="M848 576 H592 V720 H848 M636 576 V720" fill="none" stroke="#7D8B99" stroke-width="1.5"/>
<text x="614" y="612" font-size="22" font-weight="600" fill="#25313B" text-anchor="middle" >D4</text>
<text x="656" y="612" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >ผลวิเคราะห์</text>
<text x="656" y="648" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >ตาราง CSV</text>
<text x="656" y="680" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >กราฟและตัวอย่าง</text>
</g>
<g id="results-publish" data-bounds="32,832,480,144">
<rect x="32" y="832" width="480" height="144" rx="4" fill="#FFFFFF" stroke="#6E879B" stroke-width="1.5"/>
<path d="M33 880 H511" stroke="#D7DEE5" stroke-width="1"/>
<text x="52" y="868" font-size="24" font-weight="600" fill="#294A65" text-anchor="start" >7. บันทึกผลสำเร็จ</text>
<text x="52" y="912" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >คำนวณ hash และบันทึก SUCCESS</text>
<text x="52" y="944" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >อัปเดต latest.json หลังสำเร็จ</text>
</g>
<g id="results-successStore" data-bounds="592,832,256,144">
<rect x="592" y="832" width="256" height="144" fill="#FFFFFF"/>
<path d="M848 832 H592 V976 H848 M636 832 V976" fill="none" stroke="#7D8B99" stroke-width="1.5"/>
<text x="614" y="868" font-size="22" font-weight="600" fill="#25313B" text-anchor="middle" >D5</text>
<text x="656" y="868" font-size="24" font-weight="600" fill="#25313B" text-anchor="start" >สถานะรัน</text>
<text x="656" y="904" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >run.json</text>
<text x="656" y="936" font-size="22" font-weight="400" fill="#25313B" text-anchor="start" >latest.json</text>
</g>
<text x="288" y="300" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="curatedStore:quality">curated</text>
<text x="568" y="280" font-size="20" font-weight="400" fill="#52616F" text-anchor="middle" data-edge-label="aggregateStore:quality">raw / valid / rejected</text>
<text x="288" y="536" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="quality:analysis">ผ่านตรวจ</text>
<text x="552" y="392" font-size="20" font-weight="400" fill="#52616F" text-anchor="middle" data-edge-label="quality:failed">ไม่ผ่าน</text>
<text x="288" y="784" font-size="20" font-weight="400" fill="#52616F" text-anchor="start" data-edge-label="analysis:publish">ผลวิเคราะห์</text>
<text x="32" y="1056" font-size="21" font-weight="400" fill="#52616F" text-anchor="start" data-note="true">หากขั้นใดผิดพลาด ระบบบันทึก FAILED และคง latest.json ของรอบก่อน</text>
</g>
</svg>
